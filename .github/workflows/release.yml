name: Release

on:
  push:
    tags: ['v*']

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout vscode-icons-api
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Get latest vscode-icons tag
        id: latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag=$(gh release view --repo vscode-icons/vscode-icons \
            --json tagName --jq .tagName)
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Checkout vscode-icons
        uses: actions/checkout@v7
        with:
          repository: vscode-icons/vscode-icons
          ref: ${{ steps.latest.outputs.tag }}
          path: vendor/vscode-icons
          fetch-depth: 1

      - name: Sync icons
        run: rsync -a --delete vendor/vscode-icons/icons/ icons/

      - name: Clean up vendored source
        run: rm -rf vendor

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          # Node 26's bundled npm supports staged publishing with OIDC.
          node-version: 26
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      - name: Publish package
        run: npm publish

      # - name: Stage package for review
      #   run: npm stage publish
